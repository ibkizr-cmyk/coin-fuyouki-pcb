name: KiCad DRC and Gerber

on:
  workflow_dispatch:
  push:
    paths:
      - "kicad/**"
      - ".github/workflows/kicad.yml"

jobs:
  kicad:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.7
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show KiCad version
        run: |
          kicad-cli --version
          echo "=== files ==="
          find . -name "*.kicad_pcb" -o -name "*.kicad_dru" | sort
          ls -la kicad/ || ls -la

      - name: Run DRC
        run: |
          mkdir -p out
          PCB=$(find . -name "coin_fuyouki.kicad_pcb" | head -1)
          echo "Using PCB: $PCB"
          if [ -z "$PCB" ]; then
            echo "ERROR: coin_fuyouki.kicad_pcb not found"
            exit 1
          fi
          kicad-cli pcb drc \
            --output out/DRC_report_v15-42_KiCad10.rpt \
            --format report \
            --refill-zones \
            "$PCB"
          echo "=== DRC REPORT ==="
          cat out/DRC_report_v15-42_KiCad10.rpt

      - name: Export Gerbers and drills
        run: |
          mkdir -p out/gerber
          PCB=$(find . -name "coin_fuyouki.kicad_pcb" | head -1)
          kicad-cli pcb export gerbers \
            --output out/gerber/ \
            --layers F.Cu,B.Cu,F.Paste,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts \
            --subtract-soldermask \
            "$PCB"
          kicad-cli pcb export drill \
            --output out/gerber/ \
            --format excellon \
            --excellon-separate-th \
            --units mm \
            "$PCB"
          ls -la out/gerber/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gerber-drc-v15-42
          path: out/
          retention-days: 14
